# StageHub — toute l'application en une commande :  docker compose up -d --build
#   Application : http://localhost:8090   ·   Emails (Mailpit) : http://localhost:8090/mail/
#   Annuaire Eureka : http://localhost:8761   ·   Gateway (pour « npm start ») : http://localhost:8088
#
# Chemin d'une requête : navigateur → Nginx (frontend) → api-gateway → service (trouvé dans Eureka)
#
# Données de démo : le programme « demo-seeder » les crée par l'API au démarrage, si le profil compose « demo » est
# actif (COMPOSE_PROFILES=demo dans .env). Les valeurs viennent du fichier .env (copie de .env.example).

services:
  postgres:
    image: postgres:17-alpine
    container_name: stagehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stagehub}
      POSTGRES_USER: ${DB_USERNAME:-stagehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    ports:
      # Exposé pour le développement local (service lancé hors Docker) ; retiré en production
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: &logs-limites
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Une base et un rôle PostgreSQL par service (même instance). Le rôle d'un service n'a de droits que sur sa base :
  # un service ne peut pas lire les données d'un autre. Idempotent : rejoué à chaque démarrage (les bases existantes
  # sont gardées, le mot de passe est resynchronisé avec .env), puis le conteneur s'arrête.
  # Script écrit ici plutôt que dans un fichier monté : il marche aussi avec un démon Docker distant (DinD de Jenkins).
  postgres-init:
    image: postgres:17-alpine
    container_name: stagehub-postgres-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-stagehub}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-stagehub}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD doit être défini dans .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD doit être défini dans .env}
      OFFRE_DB_PASSWORD: ${OFFRE_DB_PASSWORD:?OFFRE_DB_PASSWORD doit être défini dans .env}
      CANDIDATURE_DB_PASSWORD: ${CANDIDATURE_DB_PASSWORD:?CANDIDATURE_DB_PASSWORD doit être défini dans .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD doit être défini dans .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        creer() {
          printf '%s\n' \
            "SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec" \
            "SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'mdp') \gexec" \
            "SELECT format('CREATE DATABASE %I OWNER %I', :'role', :'role') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'role') \gexec" \
            "SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'role') \gexec" \
            | psql -q -v ON_ERROR_STOP=1 -v role="$$1" -v mdp="$$2"
          echo "Base et rôle $$1 prêts"
        }
        creer stagehub_auth "$$AUTH_DB_PASSWORD"
        creer stagehub_notification "$$NOTIFICATION_DB_PASSWORD"
        creer stagehub_offre "$$OFFRE_DB_PASSWORD"
        creer stagehub_candidature "$$CANDIDATURE_DB_PASSWORD"
        creer stagehub_ai "$$AI_DB_PASSWORD"
        # Base par défaut du compte administrateur (créée par l'image postgres, sans données d'application) :
        # PostgreSQL y autorise la connexion de tous les rôles ; on la réserve à son propriétaire
        printf '%s\n' "SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'base') \gexec" \
          | psql -q -v ON_ERROR_STOP=1 -v base="$$PGDATABASE"
    logging: *logs-limites

  # Faux serveur SMTP : capture tous les emails, rien ne part vraiment.
  # Interface servie sous /mail/ (MP_WEBROOT) : via Nginx sur http://localhost:8090/mail/,
  # ou directement sur http://localhost:8025/mail/ en développement.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: stagehub-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_WEBROOT: mail
      # Mot de passe de l'interface (format utilisateur:motdepasse) ; vide = pas de mot de passe (local)
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logs-limites

  # ---- Phase 7 (e) : Kafka --------------------------------------------------------------------------------------

  # Kafka en mode KRaft : un seul nœud, à la fois broker (stocke les messages) et contrôleur (gère les métadonnées
  # du cluster) ; plus de ZooKeeper. Réplication 1 : suffisant pour une démo, pas pour de la production.
  kafka:
    image: apache/kafka:4.3.2
    container_name: stagehub-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Identifiant du cluster (formatage du stockage au premier démarrage) : pas un secret
      CLUSTER_ID: jEad27BokxJQs49ImtnDvg
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics créés explicitement (kafka-init) : une faute de frappe dans un nom ne crée pas un topic fantôme
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logs-limites

  # Topics et leurs topics d'erreurs (.DLT), 3 partitions chacun, puis arrêt. Idempotent (--if-not-exists).
  # La clé des messages (id de la candidature...) choisit la partition : les événements d'un même objet restent
  # dans l'ordre, ceux d'objets différents peuvent être traités en parallèle.
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: stagehub-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for topic in stagehub.candidature.statut-change stagehub.candidature.creee stagehub.entreprise.validation; do
          for nom in "$$topic" "$$topic.DLT"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
              --topic "$$nom" --partitions 3 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    logging: *logs-limites

  # ---- Phase 7 : annuaire des services et point d'entrée de l'API --------------------------------------------

  # Annuaire Eureka : chaque service s'y enregistre. Tableau de bord : http://localhost:8761 (local uniquement)
  discovery-server:
    build:
      context: ./services
      args:
        SERVICE: discovery-server
    image: ${IMAGE_REGISTRY:-}stagehub-discovery-server:${TAG_DISCOVERY_SERVER:-${IMAGE_TAG:-local}}
    container_name: stagehub-discovery-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: discovery-server
    ports:
      # Boucle locale seulement, en IPv4 ET en IPv6 : sous Windows, « localhost » est d'abord résolu en ::1
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"
      - "[::1]:${EUREKA_PORT:-8761}:8761"
    deploy:
      resources:
        limits:
          # 256 Mo prévus au plan, mais ~240 Mo mesurés au repos (serveur Eureka : Jersey, XStream) : trop juste
          memory: 320m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Délai de grâce des services Java : au démarrage à froid de toute la pile, ils se partagent le processeur et
      # mettent jusqu'à ~105 s (mesuré) ; avec 60 s, un service lent était déclaré « unhealthy » et bloquait le reste
      start_period: 120s
    logging: *logs-limites

  # Gateway : seule porte d'entrée de l'API (Nginx → gateway → services). Vérifie le JWT avec la clé publique
  # d'auth-service, traite CORS, relaie vers les instances trouvées dans Eureka.
  api-gateway:
    build:
      context: ./services
      args:
        SERVICE: api-gateway
    image: ${IMAGE_REGISTRY:-}stagehub-api-gateway:${TAG_API_GATEWAY:-${IMAGE_TAG:-local}}
    container_name: stagehub-api-gateway
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      # Origines autorisées : l'application publiée et le serveur de développement Angular (npm start)
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8090},http://localhost:4200
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    ports:
      # Pour le développement Angular (npm start relaie /api ici) ; boucle locale seulement, retiré en production
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8080"
      - "[::1]:${GATEWAY_PORT:-8088}:8080"
    deploy:
      resources:
        limits:
          memory: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # ---- Microservices ---------------------------------------------------------------------------------------------

  # Comptes, connexion, JWT RS256. Clé privée connue de ce seul service : JWT_PRIVATE_KEY si elle est fournie (serveur),
  # sinon générée au premier démarrage et gardée dans le volume auth-cles (essai local en une commande)
  auth-service:
    build:
      context: ./services
      args:
        SERVICE: auth-service
    image: ${IMAGE_REGISTRY:-}stagehub-auth-service:${TAG_AUTH_SERVICE:-${IMAGE_TAG:-local}}
    container_name: stagehub-auth-service
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_KEY_FILE: /data/jwt-private.key
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Services qui détiennent les profils créés à l'inscription (saga)
      PROFILS_ETUDIANT_SERVICE: candidature-service
      PROFILS_ENTREPRISE_SERVICE: offre-service
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    volumes:
      - auth-cles:/data
    deploy:
      resources:
        limits:
          # 384 Mo prévus : ~325 Mo mesurés hors cache (Spring Cloud + JPA + Feign), trop juste
          memory: 448m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # Emails : consomme les événements Kafka (candidatures, entreprises), idempotent, topic d'erreurs en cas d'échec
  notification-service:
    build:
      context: ./services
      args:
        SERVICE: notification-service
    image: ${IMAGE_REGISTRY:-}stagehub-notification-service:${TAG_NOTIFICATION_SERVICE:-${IMAGE_TAG:-local}}
    container_name: stagehub-notification-service
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # SMTP vu depuis le conteneur : Mailpit par défaut, ou un vrai serveur (SMTP_HOST/SMTP_PORT dans .env)
      MAIL_HOST: ${SMTP_HOST:-mailpit}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@stagehub.local}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8090}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    deploy:
      resources:
        limits:
          # 320 Mo prévus : ~310 Mo mesurés (Kafka + JPA + mail), trop juste
          memory: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # Offres et entreprises (profils, validation par l'admin, statistiques des offres), fermeture nocturne des offres
  # expirées. Pas de container_name : plusieurs instances possibles (docker compose up -d --scale offre-service=2),
  # trouvées par la gateway dans Eureka ; ShedLock garantit qu'une seule exécute la tâche nocturne.
  offre-service:
    build:
      context: ./services
      args:
        SERVICE: offre-service
    image: ${IMAGE_REGISTRY:-}stagehub-offre-service:${TAG_OFFRE_SERVICE:-${IMAGE_TAG:-local}}
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      DB_HOST: postgres
      DB_PORT: 5432
      OFFRE_DB_PASSWORD: ${OFFRE_DB_PASSWORD}
      # Validation des entreprises publiée par l'outbox (pas de depends_on : sans Kafka, les événements attendent)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Fermeture des offres expirées (cron Spring, 6 champs) ; ex. "0 * * * * *" pour la démonstration ShedLock
      OFFRES_CRON_FERMETURE: ${OFFRES_CRON_FERMETURE:-0 5 0 * * *}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    deploy:
      resources:
        limits:
          memory: 448m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # Profils étudiants, CV et candidatures (dernier morceau du monolithe, phase 7 d). Lit les offres dans offre-service
  # (OpenFeign + circuit breaker) ; publie les changements de statut dans Kafka (outbox).
  candidature-service:
    build:
      context: ./services
      args:
        SERVICE: candidature-service
    image: ${IMAGE_REGISTRY:-}stagehub-candidature-service:${TAG_CANDIDATURE_SERVICE:-${IMAGE_TAG:-local}}
    container_name: stagehub-candidature-service
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      DB_HOST: postgres
      DB_PORT: 5432
      CANDIDATURE_DB_PASSWORD: ${CANDIDATURE_DB_PASSWORD}
      # Changements de statut publiés par l'outbox (pas de depends_on : sans Kafka, les événements attendent)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CV_STORAGE_DIR: /data/cv
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    volumes:
      # CV déposés par les étudiants ; monté sur /data, qui appartient à l'utilisateur du service (cf. Dockerfile)
      - cv-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # Analyse des candidatures par IA (phase 8 : Spring AI + Ollama). Phase 7 (f) : squelette sans API, qui reçoit
  # chaque candidature créée par Kafka et l'enregistre comme demande d'analyse (consommateur idempotent, DLT).
  ai-service:
    build:
      context: ./services
      args:
        SERVICE: ai-service
    image: ${IMAGE_REGISTRY:-}stagehub-ai-service:${TAG_AI_SERVICE:-${IMAGE_TAG:-local}}
    container_name: stagehub-ai-service
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    deploy:
      resources:
        limits:
          memory: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging: *logs-limites

  # Phase 8 : modèle de langage local pour l'analyse des candidatures. Profil « ia » : ne démarre que sur demande
  # (COMPOSE_PROFILES=demo,ia), car il occupe plusieurs Go de mémoire. Port non publié : ai-service le joint par son
  # nom. Modèles dans le volume ollama-modeles : docker compose exec ollama ollama pull <modèle>
  ollama:
    image: ollama/ollama:0.40.3
    container_name: stagehub-ollama
    restart: unless-stopped
    profiles: ["ia"]
    environment:
      # Une analyse à la fois (le processeur est partagé avec toute la pile), un seul modèle en mémoire, déchargé
      # après 10 min sans demande
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-modeles:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logs-limites

  frontend:
    build: ./frontend
    image: ${IMAGE_REGISTRY:-}stagehub-frontend:${TAG_FRONTEND:-${IMAGE_TAG:-local}}
    container_name: stagehub-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      candidature-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      offre-service:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8080"
    logging: *logs-limites

  # Données de démo, créées par l'API (inscriptions, validations, offres, candidatures) puis arrêt.
  # Seulement avec le profil compose « demo » ; ne fait rien si elles existent déjà.
  demo-seeder:
    build:
      context: ./services
      args:
        SERVICE: demo-seeder
    image: ${IMAGE_REGISTRY:-}stagehub-demo-seeder:${TAG_DEMO_SEEDER:-${IMAGE_TAG:-local}}
    container_name: stagehub-demo-seeder
    profiles: ["demo"]
    restart: "no"
    depends_on:
      frontend:
        condition: service_started
    environment:
      API_URL: http://api-gateway:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logs-limites

volumes:
  postgres-data:
  # CV déposés par les étudiants : conservés quand les conteneurs sont recréés
  cv-data:
  # Clé de signature générée par auth-service quand JWT_PRIVATE_KEY n'est pas fourni
  auth-cles:
  # Messages Kafka (et positions de lecture des groupes de consommateurs)
  kafka-data:
  # Modèles téléchargés par Ollama (plusieurs Go : on ne les retélécharge pas à chaque recréation du conteneur)
  ollama-modeles:
