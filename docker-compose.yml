services:
  postgres:
    image: postgres:17-alpine
    container_name: stagehub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stagehub}
      POSTGRES_USER: ${DB_USERNAME:-stagehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Faux serveur SMTP pour le développement : capture tous les emails, rien ne part vraiment.
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: stagehub-mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
