services:
  postgres:
    image: postgres:17-alpine
    container_name: stagehub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stagehub}
      POSTGRES_USER: ${DB_USERNAME:-stagehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
