server:
  # Hors Docker (8085 est pris par Jenkins) ; dans un conteneur, la variable SERVER_PORT (Dockerfile) a priorité
  port: 8086
  # Derrière la gateway : X-Forwarded-* donnent l'adresse publique (en-tête Location des candidatures créées)
  forward-headers-strategy: framework
  # Arrêt propre : les requêtes en cours se terminent (20 s maximum) avant l'arrêt du conteneur
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: candidature-service
  config:
    # En local, lit le fichier .env à la racine du dépôt s'il existe (ignoré sinon)
    import: optional:file:../../.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${CANDIDATURE_DB_NAME:stagehub_candidature}
    username: ${CANDIDATURE_DB_USERNAME:stagehub_candidature}
    password: ${CANDIDATURE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Charge les collections paresseuses par lots (IN (...)) au lieu d'une requête par élément (N+1)
        default_batch_fetch_size: 32
  data:
    web:
      pageable:
        max-page-size: 50
  web:
    # Messages de validation (Bean Validation) en français, quelle que soit la langue du client
    locale: fr
    locale-resolver: fixed
  flyway:
    # Migrations du service + tables des bibliothèques (outbox : V1000, audit : V1001)
    locations: classpath:db/migration,classpath:db/outbox,classpath:db/audit
    # Une nouvelle migration du service (V2…) a un numéro plus petit que celles des bibliothèques déjà appliquées
    # (V1002) : sans ce réglage, Flyway refuse de l'appliquer à une base existante (constaté).
    # Les deux séries touchent des tables distinctes : leur ordre relatif n'a pas d'importance.
    out-of-order: true
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    circuitbreaker:
      resilience4j:
        # L'appel reste dans le thread de la requête : sinon le jeton (RequestContextHolder) ne serait plus lisible
        # par RelaisJetonFeignConfig. La durée est bornée par les délais de Feign, pas par un TimeLimiter.
        disable-thread-pool: true
        disable-time-limiter: true
    openfeign:
      # Chaque appel Feign passe par un circuit breaker Resilience4j (voir resilience4j ci-dessous)
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # Sans délai, un offre-service lent bloquerait les threads de ce service : la panne se propagerait
            connect-timeout: 2000
            read-timeout: 3000
  kafka:
    # Événements publiés par le relais de l'outbox ; les emails partent de notification-service
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Le JSON est produit par OutboxService (et stocké tel quel dans l'outbox) : le producteur envoie du texte
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Accusé de réception seulement quand le message est enregistré ; producteur idempotent (pas de doublon
      # créé par les nouvelles tentatives du client lui-même)
      acks: all
      properties:
        enable.idempotence: true
        # Kafka arrêté : échouer vite (le relais réessaie à chaque passage) au lieu de bloquer 60 s
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    # États de l'analyse des candidatures, publiés par ai-service
    consumer:
      group-id: candidature-service
      # Premier démarrage du groupe : lire depuis le début (aucun résultat d'analyse perdu)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Texte brut : le JSON est lu par AnalyseCandidatureListener (illisible → topic d'erreurs, sans nouvel essai)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Faux dans les tests sans Kafka (le consommateur n'essaie pas de se connecter)
      auto-startup: ${KAFKA_CONSOMMATEUR_ACTIF:true}
      # Le traitement d'un message continue la trace reçue (en-tête traceparent), celle de la candidature
      observation-enabled: true
  servlet:
    multipart:
      # Première barrière : Spring refuse les fichiers trop gros avant le contrôleur (le service revérifie)
      max-file-size: 5MB
      max-request-size: 6MB

stagehub:
  topics:
    analyse: stagehub.candidature.analyse
  erreurs:
    # Échec passager (base momentanément indisponible...) : nouvelles tentatives espacées de 2 s, 4 s, 8 s, puis « .DLT »
    tentatives: 3
    premier-delai: 2s
  analyse:
    # Même valeur qu'ai-service (IA_ACTIVE) : faux = une analyse en attente s'affiche « désactivée »
    active: ${IA_ACTIVE:false}
    # Même valeur qu'ai-service (IA_FOURNISSEUR) : ollama (le CV reste sur le serveur) ou openai (il est envoyé à
    # OpenAI) ; décide du texte d'information de l'étudiant
    fournisseur: ${IA_FOURNISSEUR:ollama}
  # Fuseau de l'horloge (Clock) et des tâches planifiées (purge de l'outbox) ; les règles de date des offres sont
  # dans offre-service
  fuseau: Africa/Casablanca
  outbox:
    relais:
      # Publication des événements de l'outbox dans Kafka (false dans les tests sans Kafka)
      actif: ${OUTBOX_RELAIS_ACTIF:true}
      intervalle: 1s
  perf:
    # Au-delà, MesureTempsAspect logue un WARN ; en dessous, un DEBUG
    seuil-lent: 500ms
  jwt:
    # Les jetons sont signés par auth-service (RS256) ; on vérifie avec sa clé publique (JWKS)
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
  cv:
    # Relatif au dossier de lancement (services/candidature-service/) ; en conteneur : /data/cv (volume cv-data)
    dossier: ${CV_STORAGE_DIR:./uploads/cv}
    taille-max: 5MB

eureka:
  client:
    # Faux dans les tests (EUREKA_ENABLED=false)
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Appels vers offre-service : copie locale de l'annuaire rafraîchie toutes les 5 s (30 par défaut), une instance
    # arrêtée cesse plus vite d'être appelée
    registry-fetch-interval-seconds: 5
  instance:
    # Adresse IP du conteneur plutôt que son nom d'hôte (identifiant aléatoire dans Docker)
    prefer-ip-address: true
    # Signe de vie toutes les 10 s (30 par défaut) ; retiré de l'annuaire après 30 s de silence
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Circuit breaker des appels vers offre-service. Sur les 20 derniers appels (5 au minimum), si la moitié échoue ou
# dépasse 2 s, le circuit s'OUVRE : les appels suivants échouent aussitôt (repli : 503 ou mode dégradé), sans attendre
# ni charger un service déjà en difficulté. Après 15 s, il est À MOITIÉ OUVERT : 3 appels d'essai, qui le referment
# s'ils réussissent. Un 404 (offre inconnue) est une réponse normale : il ne compte pas comme un échec.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound

management:
  tracing:
    sampling:
      # Traçage : toutes les requêtes sont tracées (0,1 par défaut). Sans exportateur, une trace ne coûte
      # presque rien, et chaque ligne de log porte le traceId de sa requête, le même dans tous les services traversés
      probability: 1.0
  endpoints:
    web:
      exposure:
        # Seul l'état de santé est exposé (healthchecks Docker), sans aucun détail interne
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness et /actuator/health/readiness
      probes:
        enabled: true

# Documentation affichée par le Swagger UI de la gateway (/v3/api-docs/candidature-service)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    # Avertissements normaux au démarrage tant que l'annuaire ne connaît pas encore les services
    com.netflix.discovery: WARN
