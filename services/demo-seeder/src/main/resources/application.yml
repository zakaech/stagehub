spring:
  application:
    name: demo-seeder
  main:
    # Programme ponctuel : pas de serveur web, il s'arrête une fois les données créées
    web-application-type: none
  config:
    import: optional:file:../../.env[.properties]

stagehub:
  demo:
    api-url: ${API_URL:http://localhost:8088}
    mot-de-passe: ${DEMO_PASSWORD:demo1234}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    attente-max: PT3M
    # Chaque service a sa propre copie de l'annuaire Eureka (relue toutes les 5 s, plus 5 s de cache du
    # LoadBalancer) : la gateway peut voir candidature-service ~10 s avant auth-service
    propagation: PT10S
