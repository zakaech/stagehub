server:
  # Hors Docker (8085 : Jenkins, 8086 : candidature-service) ; dans un conteneur, SERVER_PORT (Dockerfile) a priorité
  port: 8087

spring:
  application:
    name: ai-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${AI_DB_NAME:stagehub_ai}
    username: ${AI_DB_USERNAME:stagehub_ai}
    password: ${AI_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Migrations du service + table de la bibliothèque outbox (V1000, V1002)
    locations: classpath:db/migration,classpath:db/outbox
    # Prochaine migration du service (V4…) plus petite que celles de la bibliothèque déjà appliquées (V1002) :
    # sans ce réglage, Flyway refuserait de l'appliquer à une base existante (voir candidature-service).
    out-of-order: true
  http:
    clients:
      # Une analyse dure plusieurs minutes sur processeur : le client HTTP qui appelle Ollama attend jusqu'à 10 min
      connect-timeout: 5s
      read-timeout: 10m
  ai:
    model:
      # Fournisseur du modèle (phase 8 d) : Ollama en local ; « none » dans les tests (modèle simulé). Un autre
      # fournisseur (ex. OpenAI) se branche par la configuration : starter et propriétés, sans toucher au code
      chat: ${IA_FOURNISSEUR:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # Choisi en phase 8 b (mesures) : seul des deux modèles testés à résister à l'injection de consigne
        model: ${OLLAMA_MODEL:qwen3.5:4b}
        # Même entrée, même sortie autant que possible ; mode « réflexion » coupé (bien trop lent sur processeur)
        temperature: 0.0
        seed: 42
        think: false
        # Consignes + offre + CV (12 000 caractères au plus) tiennent dans 8 192 jetons
        num-ctx: 8192
    retry:
      # Pas de nouvelles tentatives de Spring AI (jusqu'à 10 par défaut, sur des appels de plusieurs minutes) : c'est
      # la demande d'analyse qui est retentée plus tard (stagehub.analyse.attentes)
      max-attempts: 1
  security:
    oauth2:
      client:
        # Phase 8 c : jeton de service demandé à auth-service (flux client credentials) pour lire les CV dans
        # candidature-service ; secret propre à ai-service (variable d'environnement, jamais dans le dépôt)
        registration:
          auth-service:
            client-id: ai-service
            client-secret: ${AI_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          auth-service:
            token-uri: ${AUTH_TOKEN_URI:http://localhost:8082/oauth2/token}
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    openfeign:
      # Le jeton ci-dessus est ajouté à chaque appel Feign, et renouvelé avant son expiration (5 min)
      oauth2:
        enabled: true
        client-registration-id: auth-service
      client:
        config:
          default:
            connect-timeout: 2000
            # Un CV fait 5 Mo au plus
            read-timeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      # Groupe propre à ce service : il reçoit chaque candidature créée, indépendamment des autres consommateurs
      group-id: ai-service
      # Premier démarrage du groupe : lire depuis le début (aucune candidature perdue si le service démarre après)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Texte brut : le JSON est lu par CandidatureCreeeListener (illisible → topic d'erreurs, sans nouvel essai)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Traçage (phase 8 a) : le traitement d'un message continue la trace reçue dans l'en-tête traceparent
      observation-enabled: true
    producer:
      # Messages en échec (topic « .DLT ») et, depuis la phase 8 d, résultats des analyses (relais de l'outbox)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Kafka arrêté : échouer vite (le relais réessaie à chaque passage) au lieu de bloquer 60 s
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

stagehub:
  topics:
    candidature-creee: stagehub.candidature.creee
  # Fuseau des tâches planifiées de la bibliothèque outbox (purge nocturne)
  fuseau: Africa/Casablanca
  outbox:
    relais:
      actif: ${OUTBOX_RELAIS_ACTIF:true}
      intervalle: 1s
  analyse:
    # Faux par défaut : il faut un modèle (profil compose « ia »). Sans lui, les demandes attendent.
    active: ${IA_ACTIVE:false}
    intervalle: 10s
    tentatives-max: 3
    # Attente avant la 2e puis la 3e tentative
    attentes: 1m,5m
    # Une demande EN_COURS depuis plus longtemps est reprise (service arrêté pendant l'analyse)
    bail: 15m
    # Écart (en points) entre le score et la part des technologies retrouvées au-delà duquel l'entreprise est alertée
    ecart-alerte: 50
  erreurs:
    # Échec passager : nouvelles tentatives espacées de 2 s, 4 s, 8 s, puis topic « .DLT »
    tentatives: 3
    premier-delai: 2s

management:
  tracing:
    sampling:
      # Toutes les requêtes sont tracées (0,1 par défaut) : sans exportateur, une trace ne coûte presque rien, et
      # chaque ligne de log porte un traceId
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.netflix.discovery: WARN
