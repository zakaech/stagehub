server:
  # Hors Docker (8080 est pris par Apache sur le poste) ; dans un conteneur, SERVER_PORT (Dockerfile) a priorité
  port: 8088

spring:
  application:
    name: api-gateway
  config:
    # En local, lit le fichier .env à la racine du dépôt s'il existe (ignoré sinon)
    import: optional:file:../../.env[.properties]
  servlet:
    multipart:
      # La gateway relaie le corps des requêtes tel quel (dépôt de CV) : elle ne doit pas le décoder
      enabled: false
  cloud:
    loadbalancer:
      # Liste des instances gardée 5 s (35 s par défaut) : un service qui (re)démarre est joint plus vite
      cache:
        ttl: 5s
    gateway:
      server:
        webmvc:
          # En-têtes X-Forwarded-* reçus d'Nginx : acceptés seulement si la requête vient d'une adresse
          # privée (réseau Docker). Sinon un client pourrait se faire passer pour un autre hôte ou une autre IP.
          trusted-proxies: '${GATEWAY_TRUSTED_PROXIES:(127\..*|10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*)}'
          # Les routes sont essayées dans l'ordre : la première dont les prédicats correspondent l'emporte.
          # RemoveRequestHeader=Origin : CORS est traité ici, une seule fois ; les services ne reçoivent plus
          # d'Origin et n'ont pas à refaire (ni à contredire) la décision. Cf. SecurityConfig.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RemoveRequestHeader=Origin
            # Les candidatures d'une offre (/entreprise/offres/{id}/candidatures) sont à candidature-service : cette
            # route, plus précise, passe donc avant celle d'offre-service (/entreprise/offres/**)
            - id: candidature-service
              uri: ${CANDIDATURE_SERVICE_URI:lb://candidature-service}
              predicates:
                - Path=/api/v1/etudiant/**,/api/v1/entreprise/offres/*/candidatures,/api/v1/entreprise/candidatures/**,/api/v1/admin/stats/candidatures
              filters:
                - RemoveRequestHeader=Origin
            - id: offre-service
              uri: ${OFFRE_SERVICE_URI:lb://offre-service}
              predicates:
                - Path=/api/v1/offres/**,/api/v1/entreprise/offres/**,/api/v1/admin/entreprises/**,/api/v1/admin/stats/offres
              filters:
                - RemoveRequestHeader=Origin
            # Chaque service tient le journal d'audit de ses entités : la gateway aiguille selon ?entite=. Sans entité
            # (ou inconnue), candidature-service répond 400 : le paramètre est obligatoire
            - id: offre-service-audit
              uri: ${OFFRE_SERVICE_URI:lb://offre-service}
              predicates:
                - Path=/api/v1/admin/audit
                - Query=entite, ENTREPRISE
              filters:
                - RemoveRequestHeader=Origin
            - id: candidature-service-audit
              uri: ${CANDIDATURE_SERVICE_URI:lb://candidature-service}
              predicates:
                - Path=/api/v1/admin/audit
              filters:
                - RemoveRequestHeader=Origin
            # Pas de route « tout le reste » : un chemin d'API inconnu reçoit un 404 de la gateway, sans atteindre
            # aucun service
            # Documentation OpenAPI de chaque service, affichée par le Swagger UI de la gateway
            - id: auth-service-api-docs
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - SetPath=/v3/api-docs
            - id: offre-service-api-docs
              uri: ${OFFRE_SERVICE_URI:lb://offre-service}
              predicates:
                - Path=/v3/api-docs/offre-service
              filters:
                - SetPath=/v3/api-docs
            - id: candidature-service-api-docs
              uri: ${CANDIDATURE_SERVICE_URI:lb://candidature-service}
              predicates:
                - Path=/v3/api-docs/candidature-service
              filters:
                - SetPath=/v3/api-docs
  http:
    clients:
      # Appels de la gateway vers les services : on n'attend pas indéfiniment une instance bloquée
      connect-timeout: 2s
      read-timeout: 30s

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Copie locale de l'annuaire rafraîchie toutes les 5 s (30 s par défaut)
    registry-fetch-interval-seconds: 5
  instance:
    # Adresse IP du conteneur plutôt que son nom d'hôte (identifiant aléatoire dans Docker)
    prefer-ip-address: true

stagehub:
  jwt:
    # Clé publique d'auth-service (RS256) : de quoi vérifier les jetons, jamais en signer
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
  cors:
    # Origines autorisées à appeler l'API depuis un navigateur (liste séparée par des virgules)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  tracing:
    sampling:
      # Traçage (phase 8 a) : toutes les requêtes sont tracées (0,1 par défaut). Sans exportateur, une trace ne coûte
      # presque rien, et chaque ligne de log porte le traceId de sa requête, le même dans tous les services traversés
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Swagger UI unique (http://.../swagger-ui.html) : une liste déroulante pour la documentation de chaque service.
# La gateway n'a pas d'API à elle : sa propre documentation est rangée sous un autre chemin, hors des routes.
springdoc:
  api-docs:
    path: /v3/api-docs-gateway
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: offre-service
        url: /v3/api-docs/offre-service
      - name: candidature-service
        url: /v3/api-docs/candidature-service

logging:
  level:
    # Avertissements normaux au démarrage tant que l'annuaire ne connaît pas encore les services
    com.netflix.discovery: WARN
