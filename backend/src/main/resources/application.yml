server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stagehub-backend
  config:
    # En local, lit le fichier .env à la racine du dépôt s'il existe (ignoré sinon).
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stagehub}
    username: ${DB_USERNAME:stagehub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Charge les collections paresseuses par lots (IN (...)) au lieu d'une requête par élément (N+1)
        default_batch_fetch_size: 32
  data:
    web:
      pageable:
        max-page-size: 50
  web:
    # Messages de validation (Bean Validation) en français, quelle que soit la langue du client
    locale: fr
    locale-resolver: fixed
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    circuitbreaker:
      resilience4j:
        # L'appel reste dans le thread de la requête : sinon le jeton (RequestContextHolder) ne serait plus lisible
        # par RelaisJetonFeignConfig. La durée est bornée par les délais de Feign, pas par un TimeLimiter.
        disable-thread-pool: true
        disable-time-limiter: true
    openfeign:
      # Phase 7 (c) : chaque appel Feign passe par un circuit breaker Resilience4j (voir resilience4j ci-dessous)
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # Sans délai, un offre-service lent bloquerait les threads du monolithe : la panne se propagerait
            connect-timeout: 2000
            read-timeout: 3000
  kafka:
    # Phase 7 (e) : événements publiés par le relais de l'outbox ; les emails partent de notification-service
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Le JSON est produit par OutboxService (et stocké tel quel dans l'outbox) : le producteur envoie du texte
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Accusé de réception seulement quand le message est enregistré ; producteur idempotent (pas de doublon
      # créé par les nouvelles tentatives du client lui-même)
      acks: all
      properties:
        enable.idempotence: true
        # Kafka arrêté : échouer vite (le relais réessaie à chaque passage) au lieu de bloquer 60 s
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  servlet:
    multipart:
      # Première barrière : Spring refuse les fichiers trop gros avant le contrôleur (le service revérifie)
      max-file-size: 5MB
      max-request-size: 6MB

stagehub:
  # Fuseau de l'horloge (Clock) et des tâches planifiées (purge de l'outbox) ; les règles de date des offres sont
  # dans offre-service depuis la phase 7 (c)
  fuseau: Africa/Casablanca
  outbox:
    relais:
      # Publication des événements de l'outbox dans Kafka (false dans les tests sans Kafka)
      actif: ${OUTBOX_RELAIS_ACTIF:true}
      intervalle: 1s
  perf:
    # Au-delà, MesureTempsAspect logue un WARN ; en dessous, un DEBUG
    seuil-lent: 500ms
  jwt:
    # Phase 7 : les jetons sont signés par auth-service (RS256) ; on vérifie avec sa clé publique (JWKS)
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
  cv:
    # Relatif au dossier de lancement (backend/) ; en conteneur : /data/cv (volume nommé cv-data)
    dossier: ${CV_STORAGE_DIR:./uploads/cv}
    taille-max: 5MB

eureka:
  client:
    # Phase 7 : vrai dans docker compose (le monolithe est derrière la gateway) ; faux par défaut, pour le
    # lancement en développement (port 8081, sans annuaire) et pour les tests
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Phase 7 (c) : le monolithe appelle offre-service ; copie locale de l'annuaire rafraîchie toutes les 5 s (30 par
    # défaut) : une instance arrêtée cesse plus vite d'être appelée
    registry-fetch-interval-seconds: 5
  instance:
    # Adresse IP du conteneur plutôt que son nom d'hôte (identifiant aléatoire dans Docker)
    prefer-ip-address: true
    # Signe de vie toutes les 10 s (30 par défaut) ; retiré de l'annuaire après 30 s de silence
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Circuit breaker des appels vers offre-service. Sur les 20 derniers appels (5 au minimum), si la moitié échoue ou
# dépasse 2 s, le circuit s'OUVRE : les appels suivants échouent aussitôt (repli : 503 ou mode dégradé), sans attendre
# ni charger un service déjà en difficulté. Après 15 s, il est À MOITIÉ OUVERT : 3 appels d'essai, qui le referment
# s'ils réussissent. Un 404 (offre inconnue) est une réponse normale : il ne compte pas comme un échec.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound

management:
  endpoints:
    web:
      exposure:
        # Seul l'état de santé est exposé (healthchecks Docker), sans aucun détail interne
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness et /actuator/health/readiness
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
