server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stagehub-backend
  config:
    # En local, lit le fichier .env à la racine du dépôt s'il existe (ignoré sinon).
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stagehub}
    username: ${DB_USERNAME:stagehub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Charge les collections paresseuses par lots (IN (...)) au lieu d'une requête par élément (N+1)
        default_batch_fetch_size: 32
  data:
    web:
      pageable:
        max-page-size: 50
  web:
    # Messages de validation (Bean Validation) en français, quelle que soit la langue du client
    locale: fr
    locale-resolver: fixed
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # En local : Mailpit (docker compose) ; aucune authentification
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # Première barrière : Spring refuse les fichiers trop gros avant le contrôleur (le service revérifie)
      max-file-size: 5MB
      max-request-size: 6MB

stagehub:
  # Fuseau de référence pour toutes les règles de date (postuler, rouvrir, fermeture nocturne)
  fuseau: Africa/Casablanca
  mail:
    expediteur: ${MAIL_FROM:no-reply@stagehub.local}
    # Base des liens insérés dans les emails (front Angular)
    url-frontend: ${FRONTEND_URL:http://localhost:4200}
  perf:
    # Au-delà, MesureTempsAspect logue un WARN ; en dessous, un DEBUG
    seuil-lent: 500ms
  offres:
    # Fermeture des offres expirées : chaque jour à 00:05 (fuseau stagehub.fuseau) ; "-" pour désactiver
    cron-fermeture: "0 5 0 * * *"
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: stagehub
  cors:
    # Liste séparée par des virgules, ex. "http://localhost:4200,https://stagehub.example.com"
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  demo:
    # Mot de passe commun des comptes de démo (profils dev et demo ; données publiques, pas un secret)
    mot-de-passe: ${DEMO_PASSWORD:demo1234}
  cv:
    # Relatif au dossier de lancement (backend/) ; en conteneur : /data/cv (volume nommé cv-data)
    dossier: ${CV_STORAGE_DIR:./uploads/cv}
    taille-max: 5MB

management:
  endpoints:
    web:
      exposure:
        # Seul l'état de santé est exposé (healthchecks Docker), sans aucun détail interne
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness et /actuator/health/readiness
      probes:
        enabled: true
  health:
    # L'envoi d'emails n'est pas indispensable : un SMTP en panne ne doit pas rendre l'application "DOWN"
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
