spring:
  application:
    name: stagehub-backend
  config:
    # En local, lit le fichier .env à la racine du dépôt s'il existe (ignoré sinon).
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stagehub}
    username: ${DB_USERNAME:stagehub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

stagehub:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: stagehub
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
